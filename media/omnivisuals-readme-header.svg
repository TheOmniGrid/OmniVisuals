<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title description">
  <title id="title">OmniVisuals — a coherent visual suite for OmniShade</title>
  <desc id="description">Dark technical banner with an optical aperture, spectral wave, layered shader planes and the OmniVisuals wordmark.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020407"/>
      <stop offset="0.52" stop-color="#07101a"/>
      <stop offset="1" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e438ff"/>
      <stop offset="0.48" stop-color="#8468ff"/>
      <stop offset="1" stop-color="#54d6ff"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#344259"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#27344b"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#4dcfff" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#6e4cff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#263444" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#backdrop)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <ellipse cx="318" cy="250" rx="390" ry="310" fill="url(#halo)"/>
  <rect x="18" y="18" width="1564" height="464" fill="none" stroke="#223344" stroke-width="2"/>
  <rect x="27" y="27" width="1546" height="446" fill="none" stroke="#54d6ff" stroke-opacity="0.16"/>

  <g transform="translate(285 250)">
    <circle r="154" fill="#050912" stroke="#273650" stroke-width="2"/>
    <g fill="url(#metal)" stroke="#6f86ad" stroke-opacity="0.58" stroke-width="1.2">
      <polygon points="-20,-151 33,-146 82,-102 32,-80"/>
      <polygon points="-20,-151 33,-146 82,-102 32,-80" transform="rotate(45)"/>
      <polygon points="-20,-151 33,-146 82,-102 32,-80" transform="rotate(90)"/>
      <polygon points="-20,-151 33,-146 82,-102 32,-80" transform="rotate(135)"/>
      <polygon points="-20,-151 33,-146 82,-102 32,-80" transform="rotate(180)"/>
      <polygon points="-20,-151 33,-146 82,-102 32,-80" transform="rotate(225)"/>
      <polygon points="-20,-151 33,-146 82,-102 32,-80" transform="rotate(270)"/>
      <polygon points="-20,-151 33,-146 82,-102 32,-80" transform="rotate(315)"/>
    </g>
    <circle r="73" fill="#02050a" stroke="url(#spectrum)" stroke-width="3"/>
    <circle r="57" fill="none" stroke="#54d6ff" stroke-opacity="0.28"/>
    <path d="M-118 7C-85-82-38-82 0 0s83 83 119-7" fill="none" stroke="#1b5e85" stroke-width="20" opacity="0.28" filter="url(#softGlow)"/>
    <path d="M-118 7C-85-82-38-82 0 0s83 83 119-7" fill="none" stroke="url(#spectrum)" stroke-width="5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="7" fill="#fff" filter="url(#glow)"/>
  </g>

  <g font-family="Consolas, 'Cascadia Mono', monospace">
    <text x="515" y="204" fill="#f3f6fb" font-size="62" font-weight="700" letter-spacing="13">OMNI</text>
    <text x="738" y="204" fill="url(#spectrum)" font-size="62" font-weight="700" letter-spacing="10">VISUALS</text>
    <text x="520" y="264" fill="#aab8c8" font-size="24" font-weight="600" letter-spacing="1.4">A COHERENT VISUAL SUITE FOR OMNISHADE.</text>
    <text x="520" y="317" fill="#7f90a4" font-size="15" font-weight="700" letter-spacing="6">DONATIONWARE  ·  SHADER ONLY  ·  WINDOWS 10 / 11</text>
    <line x1="520" y1="348" x2="1080" y2="348" stroke="url(#spectrum)" stroke-width="2" opacity="0.65"/>
    <text x="520" y="382" fill="#536579" font-size="13" letter-spacing="3">LIGHT  ·  DEPTH  ·  MOTION  ·  COLOR  ·  HDR</text>
  </g>

  <g transform="translate(1190 74)">
    <path d="M0 52L82 19V319L0 352Z" fill="#101826" stroke="#8468ff" stroke-width="2" opacity="0.78"/>
    <path d="M69 41L151 8V308L69 341Z" fill="#0b1721" stroke="#54d6ff" stroke-width="2" opacity="0.7"/>
    <path d="M138 53L220 20V320L138 353Z" fill="#121525" stroke="#a554ff" stroke-width="2" opacity="0.62"/>
    <path d="M207 67L289 34V334L207 367Z" fill="#091721" stroke="#36caff" stroke-width="2" opacity="0.54"/>
    <path d="M-35 196C30 112 76 277 145 179s105 91 191-6" fill="none" stroke="#572789" stroke-width="18" opacity="0.22" filter="url(#softGlow)"/>
    <path d="M-35 196C30 112 76 277 145 179s105 91 191-6" fill="none" stroke="url(#spectrum)" stroke-width="4" filter="url(#glow)"/>
    <g fill="#54d6ff" opacity="0.85">
      <rect x="246" y="277" width="15" height="50" rx="3"/>
      <rect x="271" y="247" width="15" height="80" rx="3"/>
      <rect x="296" y="208" width="15" height="119" rx="3"/>
      <rect x="321" y="159" width="15" height="168" rx="3"/>
    </g>
  </g>
</svg>
