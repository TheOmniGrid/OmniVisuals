name: OmniVisuals feature request
description: Suggest a consumer-facing gaming or visual-pipeline improvement.
title: "[Feature] "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Gaming problem or visual goal
      description: Describe the result you want rather than a private implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Expected compatibility or performance tradeoffs
  - type: checkboxes
    id: scope
    attributes:
      label: Consumer boundary
      options:
        - label: This request is for the gaming-focused shader suite and does not require a DLL, injector, telemetry, capture, calibration or developer-analysis surface.
          required: true
